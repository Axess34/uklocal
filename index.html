<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>UK Local | Affordable websites for local businesses</title>
<meta name="description" content="UK Local builds simple, beautiful websites for local UK businesses. Coming soon.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--accent:#c8102e;--ink:#1c1f24;--muted:#5b6270;--bg:#f7f5f0}
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif;padding:2rem;text-align:center;
background-image:radial-gradient(circle at 15% 20%,color-mix(in srgb,var(--accent) 12%,transparent) 0,transparent 40%),radial-gradient(circle at 85% 80%,color-mix(in srgb,var(--accent) 10%,transparent) 0,transparent 45%)}
.logo{font-family:Fraunces,Georgia,serif;font-size:clamp(2.6rem,7vw,4.2rem);letter-spacing:-.02em}
.logo span{color:var(--accent)}
.bar{width:64px;height:4px;background:var(--accent);border-radius:2px;margin:1.4rem auto}
.tag{font-size:clamp(1.1rem,2.6vw,1.4rem);font-weight:500;max-width:32rem}
.sub{color:var(--muted);margin-top:.8rem;max-width:30rem;line-height:1.6}
.pill{display:inline-block;margin-top:2rem;padding:.45rem 1rem;border:1px solid var(--accent);color:var(--accent);border-radius:999px;font-size:.85rem;letter-spacing:.12em;text-transform:uppercase}
a.mail{display:inline-block;margin-top:1.6rem;color:#fff;background:var(--accent);padding:.85rem 1.6rem;border-radius:10px;text-decoration:none;font-weight:500}
a.mail:hover{filter:brightness(1.08)}
footer{position:fixed;bottom:1rem;font-size:.8rem;color:var(--muted)}
</style>
</head>
<body>
<div class="logo">UK <span>Local</span></div>
<div class="bar"></div>
<p class="tag">Affordable websites for local businesses</p>
<p class="sub">Simple, beautiful websites for UK restaurants, bars and tradies, built from your own photos and ready to go.</p>
<div class="pill">Coming soon</div><br>
<a class="mail" href="mailto:hello@uklocal.online">hello@uklocal.online</a>
<footer>&copy; 2026 UK Local &middot; uklocal.online</footer>
</body>
</html>
